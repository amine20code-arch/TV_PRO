<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream DZ</title><script src="hls.min.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{height:48px;background:#1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:2px solid #00a8ff;font-size:14px;flex:none}
#tabs{background:#111;padding:3px;flex:none}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#left{width:280px;background:#141414;padding:8px;overflow:auto}
#center{flex:1;background:#000;display:flex;flex-direction:column;min-width:0}
#right{width:320px;background:#141414;display:flex;flex-direction:column}
input{width:100%;padding:9px;margin:3px 0;border-radius:5px;border:1px solid #333;background:#0a0a0a;color:#fff;font-size:13px}
button{width:100%;padding:9px;margin:3px 0;background:#00a8ff;border:none;border-radius:5px;color:#fff;font-weight:bold;cursor:pointer}
.ch{padding:11px 10px;border-bottom:1px solid #222;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.ch .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .bd{font-size:10px;color:#888}
.ch.focus{background:#00a8ff;color:#000;font-weight:bold}
.ch.focus .bd{color:#000}
.tab{padding:7px 12px;cursor:pointer;border-bottom:2px solid transparent;font-size:12px;display:inline-block}
.tab.on{border-color:#00a8ff;color:#00a8ff}
.nf{outline:3px solid #ffeb3b;outline-offset:-1px}
#list{flex:1;overflow:auto}
#empty{padding:20px;color:#777;font-size:12px;text-align:center}
#vid{flex:1;width:100%;min-height:0;background:#000}
#info{padding:7px;background:#1a1a1a;font-size:11px;color:#aaa;flex:none}
#log{color:#0f0;font-size:11px;margin-top:6px;max-height:70px;overflow:auto;word-break:break-word}
#log.err{color:#ff5252}
@media(max-width:900px){#main{flex-direction:column}#left,#right{width:100%;max-height:34%}#center{min-height:30%}}
</style></head><body>
<div id="top"><b style="color:#00a8ff">STREAM DZ</b><small>خفيف لـ Stream</small><span id="cnt">0 قناة</span></div>
<div id="tabs"><span class="tab on" data-nav data-t="live">مباشر</span><span class="tab" data-nav data-t="movie">أفلام</span><span class="tab" data-nav data-t="series">مسلسل</span><span class="tab" data-nav data-t="radio">راديو</span><input id="s" data-nav placeholder="بحث..." style="width:130px;display:inline-block;margin-right:8px"></div>
<div id="main">
<div id="left">
<button id="fb" data-nav>فتح ملف TXT/M3U</button><input type="file" id="f" hidden accept=".txt,.m3u,.m3u8">
<input id="mU" data-nav placeholder="رابط M3U http://..."><button id="mB" data-nav>تحميل الرابط</button>
<input id="stP" data-nav placeholder="Portal http://.../c/"><input id="stM" data-nav placeholder="MAC 00:1A:79:xx:xx:xx"><input id="stPath" data-nav placeholder="مسار API (اختياري) /stalker_portal/server/load.php"><button id="stB" data-nav style="background:#ff8c00">Stalker</button>
<input id="xH" data-nav placeholder="Host http://...:8080"><input id="xU" data-nav placeholder="User"><input id="xP" data-nav placeholder="Pass"><button id="xB" data-nav style="background:#00c853">⚡ Xtream</button>
<button id="engB" data-nav style="background:#6a1b9a">المشغّل: تلقائي</button><button id="clB" data-nav style="background:#444">مسح البيانات المحفوظة</button>
<div id="log"></div>
</div>
<div id="center"><video id="vid" controls autoplay playsinline></video><div id="info">Stream DZ جاهز • ↑↓ تنقل • OK تشغيل • ←→ للتبديل بين القائمة واللوحة</div></div>
<div id="right"><div id="list"><div id="items"></div><div id="empty">لا توجد قنوات — حمّل ملفاً أو رابطاً أو سجّل Xtream</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id),PAGE=350,UA='Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3';
let eng='auto',H=null,A=[],V=[],CAT='live',fi=0,shown=0,query='',sub=null,X=null,S=null,tok=0,zone='list',pi=0,cntN=0;
const L=$('items'),v=$('vid');
function val(id){return $(id).value}
function info(t){$('info').textContent=t}
function msg(t,bad){const l=$('log');l.textContent=t;l.className=bad?'err':''}
// ---------- بيانات ----------
function compute(){
  const q=query.trim().toLowerCase();
  const base=sub?sub.items:A.filter(x=>x.t===CAT);
  const r=q?base.filter(x=>(x.l||(x.l=x.n.toLowerCase())).includes(q)):base;
  cntN=r.length;
  V=sub?[{n:'⬅ رجوع',back:1}].concat(r):r;
}
function refresh(){
  compute();
  $('cnt').textContent=cntN+' قناة';
  L.textContent='';shown=0;appendMore();
  $('empty').style.display=V.length?'none':'block';
  if(fi>=V.length)fi=Math.max(0,V.length-1);
  while(fi>=shown&&shown<V.length)appendMore();
  markFocus();
}
function badge(c){return c.back?'':c.kind==='series'?'▸':c.t==='live'?'●':c.t==='movie'?'فيلم':c.t==='radio'?'راديو':''}
function appendMore(){
  const end=Math.min(V.length,shown+PAGE),fr=document.createDocumentFragment();
  for(let i=shown;i<end;i++){
    const c=V[i],d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('span');
    d.className='ch';a.className='nm';b.className='bd';
    a.textContent=c.n;b.textContent=badge(c);
    d.appendChild(a);d.appendChild(b);
    d.onclick=()=>{zone='list';play(i)};
    fr.appendChild(d);
  }
  shown=end;L.appendChild(fr);
}
function markFocus(){
  const it=L.children;
  for(let i=0;i<it.length;i++)it[i].classList.toggle('focus',i===fi);
  const el=it[fi];if(el&&zone==='list')el.scrollIntoView({block:'nearest'});
}
function setT(c){
  CAT=c;sub=null;fi=0;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===c));
  refresh();
}
function afterLoad(){
  sub=null;fi=0;
  if(!A.some(x=>x.t===CAT)){const f=['live','movie','series','radio'].find(c=>A.some(x=>x.t===c));if(f){setT(f);return}}
  refresh();
}
// ---------- شبكة ----------
const pend={};let seq=0;
window.__nat=(id,st,body)=>{const p=pend[id];if(!p)return;delete pend[id];(st>=200&&st<400)?p.res(body):p.rej(new Error('HTTP '+st+' '+String(body).slice(0,80)))};
function nat(url,headers){return new Promise((res,rej)=>{
  if(!window.Android||!window.Android.http){rej(new Error('NOAPP'));return}
  const id='r'+(++seq);pend[id]={res,rej};window.Android.http(id,url,JSON.stringify(headers||{}));
})}
async function getText(url){
  try{
    const c=new AbortController(),to=setTimeout(()=>c.abort(),40000);
    try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}
    finally{clearTimeout(to)}
  }catch(e){
    if(window.Android&&window.Android.http&&!/^HTTP/.test(e.message||''))return await nat(url,{});
    throw e;
  }
}
// ---------- M3U / TXT ----------
function classify(s){let t='live';if(/movie|فيلم/i.test(s))t='movie';if(/series|مسلسل/i.test(s))t='series';if(/radio/i.test(s))t='radio';return t}
function extName(l){let q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"')q=!q;else if(c===','&&!q)return l.slice(i+1).trim()}return ''}
const isUrl=s=>/^[a-z][a-z0-9+.-]*:\/\//i.test(s);
function parseList(t){
  const out=[];
  if(t.includes('#EXTINF')){
    let n='',g='';
    for(let l of t.split(/\r?\n/)){
      l=l.trim();if(!l)continue;
      if(l.startsWith('#EXTINF')){const m=l.match(/group-title="([^"]*)"/i);g=m?m[1]:'';n=extName(l)}
      else if(l[0]==='#')continue;
      else if(isUrl(l)){out.push({n:n||l,u:l,t:classify(g+' '+n+' '+l)});n='';g=''}
    }
  }else{
    for(let l of t.split(/\r?\n/)){
      l=l.trim();if(!l||l[0]==='#')continue;
      const i=l.indexOf('|');let a=i<0?l:l.slice(0,i).trim(),b=i<0?l:l.slice(i+1).trim();
      if(!isUrl(a)&&isUrl(b)){const x=a;a=b;b=x}
      if(isUrl(a))out.push({n:b||a,u:a,t:classify(b+' '+a)});
    }
  }
  return out;
}
function loadText(t,src){
  const r=parseList(t);
  if(!r.length)return msg('لم يتم العثور على روابط في '+src,1);
  A=r;X=null;S=null;afterLoad();msg('✅ '+A.length+' عنصر جاهز');
}
function loadF(){
  const f=$('f').files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{loadText(String(rd.result),'الملف');$('f').value=''};
  rd.onerror=()=>msg('تعذر قراءة الملف',1);
  rd.readAsText(f);
}
async function loadU(){
  let u=val('mU').trim();if(!u)return msg('أدخل رابط M3U',1);
  if(!isUrl(u))u='http://'+u;
  msg('⏳ جاري التحميل...');
  try{loadText(await getText(u),'الرابط')}catch(e){msg('خطأ: '+(e.message||e),1)}
}
// ---------- Xtream ----------
async function xt(){
  let h=val('xH').trim();const u=val('xU').trim(),p=val('xP').trim();
  if(!h||!u||!p)return msg('املأ الحقول',1);
  if(!isUrl(h))h='http://'+h;h=h.replace(/\/+$/,'');
  const eu=encodeURIComponent(u),ep=encodeURIComponent(p);
  const api=`${h}/player_api.php?username=${eu}&password=${ep}&action=`;
  const get=async a=>{const j=JSON.parse(await getText(api+a));return Array.isArray(j)?j:[]};
  msg('⏳ جاري التحميل...');
  const [lv,vd,sr]=await Promise.allSettled([get('get_live_streams'),get('get_vod_streams'),get('get_series')]);
  const ok=r=>r.status==='fulfilled'?r.value:[];
  const items=[];
  ok(lv).forEach(x=>items.push({n:String(x.name||x.stream_id),u:`${h}/live/${eu}/${ep}/${x.stream_id}.m3u8`,t:'live'}));
  ok(vd).forEach(x=>items.push({n:String(x.name||x.stream_id),u:`${h}/movie/${eu}/${ep}/${x.stream_id}.${x.container_extension||'mp4'}`,t:'movie'}));
  ok(sr).forEach(x=>items.push({n:String(x.name||x.series_id),t:'series',kind:'series',sid:x.series_id}));
  if(!items.length){const e=[lv,vd,sr].find(r=>r.status==='rejected');return msg('فشل: تحقق من البيانات أو الاتصال'+(e?' ('+(e.reason.message||e.reason)+')':''),1)}
  A=items;X={h,u:eu,p:ep};S=null;afterLoad();
  msg(`✅ Xtream: ${ok(lv).length} مباشر • ${ok(vd).length} فيلم • ${ok(sr).length} مسلسل`);
}
async function openSeries(c){
  if(!X)return;
  info('⏳ '+c.n);
  try{
    const j=JSON.parse(await getText(`${X.h}/player_api.php?username=${X.u}&password=${X.p}&action=get_series_info&series_id=${encodeURIComponent(c.sid)}`));
    const E=j.episodes||{},eps=[];
    Object.keys(E).sort((a,b)=>a-b).forEach(k=>{(Array.isArray(E[k])?E[k]:[]).forEach(e=>{
      eps.push({n:`S${e.season||k} E${e.episode_num||''} - ${e.title||e.id}`,u:`${X.h}/series/${X.u}/${X.p}/${e.id}.${e.container_extension||'mp4'}`,t:'series'});
    })});
    if(!eps.length)return info('لا توجد حلقات');
    sub={items:eps};fi=0;refresh();info(''+c.n);
  }catch(e){info('⚠ تعذر تحميل الحلقات')}
}
// ---------- Stalker (يعمل داخل التطبيق فقط) ----------
async function stalker(){
  if(!window.Android)return msg('Stalker يعمل داخل التطبيق فقط',1);
  let raw=val('stP').trim();const mac=val('stM').trim().toUpperCase();
  if(!raw)return msg('دخل Portal',1);
  if(!/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(mac))return msg('أدخل عنوان MAC صحيحاً (المسجّل لدى مزوّد الخدمة)',1);
  if(!isUrl(raw))raw='http://'+raw;
  const base=raw.replace(/\/+$/,'').replace(/\/c$/i,'');
  const hd={Cookie:`mac=${mac}; stb_lang=en; timezone=GMT`,'User-Agent':UA,'X-User-Agent':'Model: MAG250; Link: WiFi'};
  msg('⏳ اتصال بالبوابة...');
  let api=null,token=null;
  const pth=val('stPath').trim();
  const cands=pth?[base+(pth[0]==='/'?'':'/')+pth]:[base+'/portal.php',base+'/server/load.php',base+'/stalker_portal/server/load.php'];
  for(const a of cands){
    try{const j=JSON.parse(await nat(`${a}?type=stb&action=handshake&token=&JsHttpRequest=1-xml`,hd));if(j.js&&j.js.token){api=a;token=j.js.token;break}}catch(e){}
  }
  if(!api)return msg('فشل الاتصال بالبوابة أو MAC غير مسجّل',1);
  const h2=Object.assign({},hd,{Authorization:'Bearer '+token});
  try{await nat(`${api}?type=stb&action=get_profile&JsHttpRequest=1-xml`,h2)}catch(e){}
  try{
    const j=JSON.parse(await nat(`${api}?type=itv&action=get_all_channels&JsHttpRequest=1-xml`,h2));
    const d=(j.js&&j.js.data)||[];
    const items=d.filter(c=>c&&c.cmd).map(c=>({n:String(c.name||'قناة'),t:'live',st:{cmd:c.cmd}}));
    if(!items.length)return msg('لا توجد قنوات (تحقق من الاشتراك)',1);
    A=items;X=null;S={api,h:h2};afterLoad();msg('✅ Stalker '+A.length+' قناة');
  }catch(e){msg('خطأ: '+(e.message||e),1)}
}
async function stResolve(st){
  const direct=(st.cmd.match(/https?:\/\/\S+/)||[])[0];
  try{
    const j=JSON.parse(await nat(`${S.api}?type=itv&action=create_link&cmd=${encodeURIComponent(st.cmd)}&forced_storage=undefined&disable_ip_check=0&JsHttpRequest=1-xml`,S.h));
    const m=String((j.js&&j.js.cmd)||'').match(/https?:\/\/\S+/);
    if(m)return m[0];
  }catch(e){}
  if(direct)return direct;
  throw new Error('no link');
}
// ---------- التشغيل ----------
function stopP(){
  v.onerror=null;
  if(H){try{H.destroy()}catch(e){}H=null}
  v.removeAttribute('src');try{v.load()}catch(e){}
}
function fail(name){info('⚠ تعذر تشغيل: '+name)}
function hlsPlay(url,my,name){
  H=new Hls({maxBufferLength:10});
  let netTry=false,medTry=false;
  H.on(Hls.Events.MANIFEST_PARSED,()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{})});
  H.on(Hls.Events.ERROR,(e,d)=>{
    if(my!==tok||!d||!d.fatal)return;
    if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&!netTry){netTry=true;H.startLoad()}
    else if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!medTry){medTry=true;H.recoverMediaError()}
    else fail(name);
  });
  H.attachMedia(v);H.loadSource(url);
}
function nativePlay(url,my,name){
  let tried=false;
  v.onerror=()=>{
    if(my!==tok)return;
    if(!tried&&typeof Hls!=='undefined'&&Hls.isSupported()){tried=true;v.onerror=null;hlsPlay(url,my,name)}
    else fail(name);
  };
  v.src=url;const p=v.play();if(p&&p.catch)p.catch(()=>{});
}
function useNative(url){
  if(!window.Android||!window.Android.playNative)return false;
  if(eng==='exo')return true;
  if(eng==='web')return false;
  return !/m3u8/i.test(url);
}
function startPlay(url,my,name){
  stopP();
  if(useNative(url)){window.Android.playNative(url,name);return}
  if(/m3u8/i.test(url)&&typeof Hls!=='undefined'&&Hls.isSupported())hlsPlay(url,my,name);
  else nativePlay(url,my,name);
}
async function play(i){
  const c=V[i];if(!c)return;
  if(c.back){sub=null;fi=0;refresh();return}
  if(c.kind==='series'){openSeries(c);return}
  fi=i;markFocus();
  const my=++tok;info('▶ '+c.n);
  let url=c.u;
  if(c.st){
    if(!S)return fail(c.n);
    try{url=await stResolve(c.st)}catch(e){if(my===tok)fail(c.n);return}
    if(my!==tok)return;
  }
  startPlay(url,my,c.n);
}
// ---------- ريموت ----------
const NAV=()=>[...document.querySelectorAll('[data-nav]')];
function setZone(z){
  zone=z;
  document.querySelectorAll('.nf').forEach(e=>e.classList.remove('nf'));
  if(z==='panel'){const n=NAV();pi=Math.max(0,Math.min(pi,n.length-1));n[pi].classList.add('nf');n[pi].scrollIntoView({block:'nearest'})}
  markFocus();
}
function activate(el){
  if(el.tagName==='INPUT'){el.focus()}else el.click();
}
function move(d){
  if(!V.length)return;
  const n=Math.max(0,Math.min(fi+d,V.length-1));
  while(n>=shown&&shown<V.length)appendMore();
  fi=n;markFocus();
}
const KC={38:'ArrowUp',40:'ArrowDown',37:'ArrowLeft',39:'ArrowRight',13:'Enter'};
document.addEventListener('keydown',e=>{
  const k=e.key&&e.key!=='Unidentified'?e.key:KC[e.keyCode];
  if(!k)return;
  const a=document.activeElement;
  if(a&&a.tagName==='INPUT'){
    pi=Math.max(0,NAV().indexOf(a));
    if(k==='ArrowDown'||k==='ArrowUp'||k==='Enter'){
      e.preventDefault();a.blur();
      if(k==='Enter'&&a.id==='s'){setZone('list');return}
      const n=NAV().length;pi=Math.max(0,Math.min(pi+(k==='ArrowUp'?-1:1),n-1));setZone('panel');
    }
    return;
  }
  if(zone==='panel'){
    const n=NAV();
    if(k==='ArrowDown')pi=Math.min(pi+1,n.length-1);
    else if(k==='ArrowUp')pi=Math.max(pi-1,0);
    else if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();setZone('list');return}
    else if(k==='Enter'){e.preventDefault();activate(n[pi]);return}
    else return;
    e.preventDefault();setZone('panel');
  }else{
    if(k==='ArrowDown'){e.preventDefault();move(1)}
    else if(k==='ArrowUp'){e.preventDefault();move(-1)}
    else if(k==='Enter'){e.preventDefault();play(fi)}
    else if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();setZone('panel')}
  }
});
window.__zap=n=>{
  zone='list';let j=fi+n;
  while(j>=0&&j<V.length&&(V[j].back||V[j].kind==='series'))j+=n;
  if(j<0||j>=V.length)return;
  while(j>=shown&&shown<V.length)appendMore();
  play(j);
};
// ---------- الإعدادات والحفظ ----------
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
const SAVE=['mU','stP','stM','stPath','xH','xU','xP'];
SAVE.forEach(id=>{const x=ls('sdz_'+id);if(x)$(id).value=x;$(id).addEventListener('input',()=>ls('sdz_'+id,$(id).value))});
const ENG=['auto','web','exo'],ENGL={auto:'تلقائي',web:'WebView',exo:'ExoPlayer'};
eng=ENG.includes(ls('sdz_eng'))?ls('sdz_eng'):'auto';
function engLabel(){$('engB').textContent='المشغّل: '+ENGL[eng]}
if(window.Android&&window.Android.playNative){
  engLabel();
  $('engB').onclick=()=>{eng=ENG[(ENG.indexOf(eng)+1)%ENG.length];ls('sdz_eng',eng);engLabel();
    msg(eng==='auto'?'تلقائي: ExoPlayer لروابط TS/MKV/MP4 وWebView لـ m3u8':eng==='exo'?'ExoPlayer لكل الروابط':'WebView لكل الروابط')};
}else $('engB').remove();
$('clB').onclick=()=>{SAVE.forEach(id=>{ls('sdz_'+id,null);$(id).value=''});ls('sdz_eng',null);eng='auto';if($('engB'))engLabel();msg('تم مسح البيانات المحفوظة')};
// ---------- ربط الواجهة ----------
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setT(t.dataset.t));
let sT;$('s').addEventListener('input',()=>{clearTimeout(sT);sT=setTimeout(()=>{query=val('s');fi=0;refresh()},200)});
$('fb').onclick=()=>$('f').click();
$('f').onchange=loadF;
$('mB').onclick=loadU;$('xB').onclick=xt;$('stB').onclick=stalker;
refresh();
</script></body></html>
